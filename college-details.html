<html lang="en">

<head>
<meta charset="UTF-8">

</head>

<body>

<header>

<h1>🎓 College Course Details</h1>

</header>

<div class="container">

<h2 id="courseName"></h2>

<p><b>Description:</b> <span id="description"></span></p>

<p><b>Duration:</b> <span id="duration"></span></p>

<p><b>Career Opportunities:</b> <span id="career"></span></p>

<p><b>Average Salary:</b> <span id="salary"></span></p>

<button>📝 Take Career Quiz</button>
</a>

<button>⬅ Back</button>
</a>

</a>

</div>

<script>

const details = {

"Software Engineer":{
description:"Develops software applications and systems.",
duration:"4 Years B.E/B.Tech or equivalent",
career:"Software Engineer, Full Stack Developer",
salary:"₹4 LPA - ₹12 LPA"
},

"Data Scientist":{
description:"Analyzes data to solve business problems.",
duration:"Bachelor's + Data Science Skills",
career:"Data Scientist, Data Analyst",
salary:"₹6 LPA - ₹15 LPA"
},

"AI Engineer":{
description:"Builds Artificial Intelligence applications.",
duration:"4 Years + AI Specialization",
career:"AI Engineer, ML Engineer",
salary:"₹8 LPA - ₹20 LPA"
},

"MBA":{
description:"Master of Business Administration.",
duration:"2 Years",
career:"Manager, Business Analyst",
salary:"₹5 LPA - ₹15 LPA"
},

"MCA":{
description:"Master of Computer Applications.",
duration:"2 Years",
career:"Software Developer, System Analyst",
salary:"₹4 LPA - ₹10 LPA"
},

"M.Tech":{
description:"Master of Technology.",
duration:"2 Years",
career:"Engineer, Researcher",
salary:"₹5 LPA - ₹12 LPA"
},

"M.E":{
description:"Master of Engineering.",
duration:"2 Years",
career:"Design Engineer, Lecturer",
salary:"₹5 LPA - ₹12 LPA"
},

"PhD":{
description:"Doctoral research degree.",
duration:"3–6 Years",
career:"Professor, Scientist, Researcher",
salary:"₹6 LPA - ₹18 LPA"
}

};

let course = localStorage.getItem("collegeCourse");

document.getElementById("courseName").innerHTML = course;

if(details[course]){

document.getElementById("description").innerHTML = details[course].description;
document.getElementById("duration").innerHTML = details[course].duration;
document.getElementById("career").innerHTML = details[course].career;
document.getElementById("salary").innerHTML = details[course].salary;

}

</script>

</body>
</html>
